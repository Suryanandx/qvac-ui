name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          OPENUI_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'
      - run: npm run build
      - run: npm test
        env:
          QVAC_UI_KEYCHAIN: '0'
